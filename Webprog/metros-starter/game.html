<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budapest Metrói - Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <!-- 1. FELSŐ SÁV: Információk -->
    <header class="game-header">
        <div class="header-info">
            Játékos: <span id="player-name-display">...</span>
        </div>
        <div class="header-info">
            Aktuális Vonal: <span id="current-line-display" style="color: yellow;">M1</span>
        </div>
        <div class="header-info">
            Eltelt idő: <span id="timer-display">00:00</span>
        </div>
    </header>

    <!-- 2. FŐ TARTALOM: A játék -->
    <main class="game-container">
        
        <!-- BAL OLDAL: A térkép -->
        <div class="board-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- JOBB OLDAL: Kezelőpanel -->
        <aside class="ui-panel">
            <div class="ui-box">
                <h3>Felfordított kártya</h3>
                <div id="card-display" class="card-placeholder">
                    <span>A</span>
                </div>
            </div>

            <div class="ui-box">
                <h3>Fordulók</h3>
                <!-- Ide kerülhetnek a soron következő vonalak ikonjai -->
                <div id="turn-order-display" class="turn-order">
                    <div class="turn-icon" style="background-color: yellow;"></div>
                    <div class="turn-icon" style="background-color: red;"></div>
                    <div class="turn-icon" style="background-color: blue;"></div>
                    <div class="turn-icon" style="background-color: green;"></div>
                </div>
            </div>

            <div class="ui-box">
                <h3>Pontozás</h3>
                <p>Pályaudvarok (PP): <span id="train-score-display">0</span></p>
                <div id="train-score-slider" class="train-slider">
                    <!-- A "csúszkát" ide generálhatod JS-sel -->
                </div>
                <p>Összpontszám: <span id="total-score-display">0</span></p>
            </div>
        </aside>

    </main>

    <!-- A játék logikája -->
    <script src="game.js"></script>
</body>
</html>
