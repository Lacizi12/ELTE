<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budapest Metrói - Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <!-- FELSŐ SÁV -->
    <header class="game-header">
        <div class="header-group">
            <span class="label">Játékos:</span>
            <span id="player-name-display" class="value">...</span>
        </div>
        <div class="header-group">
            <span class="label">Aktuális Vonal:</span>
            <span id="current-line-display" class="value line-indicator">M1</span>
        </div>
        <div class="header-group">
            <span class="label">Eltelt idő:</span>
            <span id="timer-display" class="value">00:00</span>
        </div>
    </header>

    <!-- FŐ TARTALOM -->
    <main class="game-container">
        
        <!-- BAL OLDAL: A térkép -->
        <div class="board-container">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- JOBB OLDAL: Kezelőpanel -->
        <aside class="ui-panel">
            
            <div class="ui-box card-box" >
                <h3>Felfordított kártya</h3>
                <div class="card-visual">
                    <div class="metro-door left"></div>
                    <div id="card-display" class="card-content">A</div>
                    <div class="metro-door right"></div>
                </div>
                <button id="skip-btn" class="action-btn">Kártya eldobása (Passz)</button>
            </div>

            <!-- 2. Fordulók -->
            <div class="ui-box">
                <h3>Következő Vonalak</h3>
                <div id="turn-order-display" class="turn-order">
                    <!-- A JS tölti fel -->
                </div>
            </div>

            <!-- 3. Pontozás -->
            <div class="ui-box score-box">
                <h3>Pontozás</h3>
                <div class="score-row">
                    <span>Pályaudvarok (PP):</span>
                    <span id="train-score-display" class="score-value">0</span>
                </div>
                <div id="train-score-slider" class="train-slider"></div>
                <hr>
                <div class="score-row total">
                    <span>Összpontszám:</span>
                    <span id="total-score-display">0</span>
                </div>
            </div>
        </aside>

    </main>

    <script src="game.js"></script>
</body>
</html>
